name: Build
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile project and regression checks
        run: mvn -B -ntp -pl client -am test-compile
