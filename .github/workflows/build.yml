name: Build

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Check compilation with start.py
        run: |
          python -m pip install psutil
          python start.py --build
      - name: Compile regression test sources
        run: mvn -B test-compile
