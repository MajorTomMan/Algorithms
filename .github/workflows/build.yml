name: 编译检查

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

# 允许提交 src/main/resources 和 src/test/resources 下的数据。
# CI/CD 不编译、不运行测试代码，只编译正式源码。
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: 仅编译正式源码
        run: mvn -B -ntp -Dmaven.test.skip=true compile
