name: Build

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Check compilation with start.py
        run: |
          python -m pip install psutil
          python start.py --build
      - name: Compile regression test sources
        run: mvn -B test-compile
      - name: Run graph regression checks
        run: |
          mvn -B -q install -DskipTests
          mvn -B -q -pl structures exec:java -Dexec.mainClass=com.majortom.algorithms.structure.graph.GraphChecks -Dexec.classpathScope=test
          mvn -B -q -pl algorithms exec:java -Dexec.mainClass=com.majortom.algorithms.algorithm.graph.impl.GraphTraversalChecks -Dexec.classpathScope=test
          java -cp client/target/test-classes:client/target/classes com.majortom.algorithms.visualization.impl.controller.GraphInspectorTextChecks
          java -cp client/target/test-classes:client/target/classes:core/target/classes com.majortom.algorithms.visualization.runtime.value.AnnotatedValueProjectionChecks
          java -cp client/target/test-classes:client/target/classes:core/target/classes com.majortom.algorithms.visualization.runtime.value.SharedValueProjectionChecks
          java -cp client/target/test-classes:client/target/classes:core/target/classes com.majortom.algorithms.visualization.runtime.value.LazyGraphProjectionChecks
          java -cp client/target/test-classes:client/target/classes com.majortom.algorithms.visualization.render.runtime.RenderSessionLifecycleChecks
