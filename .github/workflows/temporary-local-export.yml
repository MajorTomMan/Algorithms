name: Temporary local build export
on:
  push:
    branches: [dev]

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile source and gather local build inputs
        run: |
          python -m pip install psutil
          python start.py --build
          mkdir -p build-kit
          git archive --format=tar.gz --output=build-kit/source.tar.gz HEAD
          tar -C "$HOME/.m2" -czf build-kit/maven-cache.tar.gz repository
          du -h build-kit/*
      - uses: actions/upload-artifact@v4
        with:
          name: temporary-multigraph-build-kit
          path: build-kit/*.tar.gz
          retention-days: 1
          if-no-files-found: error
