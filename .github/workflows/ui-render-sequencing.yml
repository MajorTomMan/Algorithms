name: UI render sequencing

on:
  push:
    branches:
      - refactor/ui-render-sequencing-20260920
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/ui-render-sequencing.yml'
      - 'client/**'
      - 'pom.xml'

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and test client reactor
        run: mvn -B -ntp -pl client -am test
